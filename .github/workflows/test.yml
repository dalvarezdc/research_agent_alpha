name: tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group dev
      - name: Run offline tests
        env:
          DSPY_CACHEDIR: ${{ runner.temp }}/dspy-cache
          LITELLM_LOCAL_MODEL_COST_MAP: "true"
        run: >-
          uv run python -m pytest tests/ -q
          -m "not integration and not requires_api"
          --ignore=tests/test_router_integration.py
          --ignore=tests/test_orchestrator_integration.py
          --ignore=tests/test_medical_agent.py
      - name: Build and inspect wheel
        run: |
          uv build
          uv run python -m zipfile -l dist/*.whl
      - name: Smoke-test installed wheel
        run: |
          wheel_target="${RUNNER_TEMP}/wheel-install"
          uv pip install --python .venv/bin/python --no-deps --target "${wheel_target}" dist/*.whl
          cd "${RUNNER_TEMP}"
          PYTHONPATH="${wheel_target}" DSPY_CACHEDIR="${RUNNER_TEMP}/dspy-wheel" \
            "${GITHUB_WORKSPACE}/.venv/bin/python" -c \
            "import api, router, run_analysis, database, medical_diagnostic_analyzer.diagnostic_agent; assert api.FRONTEND_DIR.joinpath('index.html').is_file()"
